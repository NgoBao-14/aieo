<div class="toeic-shell">
  <header class="toeic-header">
    <a class="toeic-logo" routerLink="/" aria-label="IELTS9S home">
      <span class="toeic-logo__main">IELTS</span><span class="toeic-logo__accent">9S</span>
    </a>

    <nav class="toeic-header__nav" aria-label="Primary navigation">
      <a routerLink="/tests" routerLinkActive="active">Luyện đề</a>
      <a routerLink="/vocabulary" routerLinkActive="active">Từ vựng</a>
      <a routerLink="/dictionary" routerLinkActive="active">Từ điển</a>
      <a routerLink="/exercises" routerLinkActive="active">Dạng bài</a>
      <a routerLink="/roadmap" routerLinkActive="active">Khoá học</a>
    </nav>

    <ng-container *ngIf="user$ | async as user; else guestAction">
      <div class="toeic-user">
        <img [src]="user.photoURL || 'assets/avatar-default.png'" [alt]="user.displayName || 'User'" />
        <div>
          <strong>{{ user.displayName }}</strong>
          <span>{{ user.email }}</span>
        </div>
        <button type="button" (click)="logout()">Đăng xuất</button>
      </div>
    </ng-container>

    <ng-template #guestAction>
      <button class="google-login" type="button" (click)="login()">
        <span class="google-login__mark">G</span>
        Đăng nhập với Google
      </button>
    </ng-template>
  </header>

  <div class="toeic-body">
    <aside class="toeic-side">
      <div class="toeic-side__panel">
        <div class="toeic-side__title">
          <h2>Luyện đề online</h2>
          <span>Độc quyền học viên IELTS9S</span>
        </div>

        <nav class="toeic-side__nav" aria-label="Study navigation">
          <a routerLink="/tests" routerLinkActive="active">
            <span class="toeic-side__icon">🎧</span>
            <span>
              <strong>Luyện đề IELTS</strong>
              <small>Listening & Reading, giải chi tiết</small>
            </span>
          </a>
          <a routerLink="/exercises" routerLinkActive="active">
            <span class="toeic-side__icon">🎯</span>
            <span>
              <strong>Dạng bài</strong>
              <small>Luyện kỹ năng theo từng dạng</small>
            </span>
          </a>
          <a routerLink="/dashboard" routerLinkActive="active">
            <span class="toeic-side__icon">📊</span>
            <span>
              <strong>Thống kê</strong>
              <small>Điểm & lịch sử làm bài</small>
            </span>
          </a>
        </nav>
      </div>
    </aside>

    <main class="toeic-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
