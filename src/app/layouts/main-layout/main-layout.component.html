<div class="app-shell">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">

    <!-- Brand -->
    <div class="sidebar__brand">
      <div class="sidebar__logo">9S</div>
      <div>
        <a class="sidebar__brand-name" routerLink="/">IELTS<span>9S</span></a>
        <p class="sidebar__brand-tagline">0 → Band 6.5</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar__nav">

      <!-- Zone 1: Lộ trình -->
      <span class="sidebar__zone-label">Lộ trình</span>

      <a routerLink="/dashboard" routerLinkActive="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Tổng quan
      </a>

      <a routerLink="/roadmap" routerLinkActive="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 17l4-8 4 4 4-6 4 4"/><circle cx="3" cy="17" r="1.5" fill="currentColor"/>
          <circle cx="7" cy="9" r="1.5" fill="currentColor"/><circle cx="11" cy="13" r="1.5" fill="currentColor"/>
          <circle cx="15" cy="7" r="1.5" fill="currentColor"/><circle cx="19" cy="11" r="1.5" fill="currentColor"/>
        </svg>
        Lộ trình 180 buổi
        <span class="sidebar__session-badge" *ngIf="currentSessionId">{{ currentSessionId }}</span>
      </a>

      <!-- Zone 2: Tự luyện -->
      <span class="sidebar__zone-label sidebar__zone-label--spaced">Tự luyện</span>

      <a routerLink="/exercises" routerLinkActive="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Dạng bài
      </a>

      <a routerLink="/tests" routerLinkActive="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Luyện đề
      </a>

      <a routerLink="/vocabulary" routerLinkActive="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Từ vựng
      </a>

      <a routerLink="/dictionary" routerLinkActive="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Từ điển
      </a>

    </nav>

    <!-- Status strip: streak + band -->
    <div class="sidebar__status" *ngIf="streak > 0 || bandEstimate > 4.0">
      <div class="sidebar__status-item" *ngIf="streak > 0">
        <span class="sidebar__status-icon">🔥</span>
        <span>{{ streak }} ngày liên tiếp</span>
      </div>
      <div class="sidebar__status-item">
        <span class="sidebar__status-icon">🎯</span>
        <span>Band ~{{ bandEstimate }}</span>
      </div>
    </div>

    <!-- Auth -->
    <div class="sidebar__auth">
      <ng-container *ngIf="user$ | async as user; else guestBlock">
        <div class="sidebar__profile">
          <img [src]="user.photoURL || 'assets/avatar-default.png'" [alt]="user.displayName || 'User'" />
          <div class="sidebar__profile-info">
            <strong>{{ user.displayName }}</strong>
            <p>{{ user.email }}</p>
          </div>
        </div>
        <button class="sidebar__logout-btn" (click)="logout()">Đăng xuất</button>
      </ng-container>
      <ng-template #guestBlock>
        <p class="sidebar__guest-hint">Đăng nhập để đồng bộ tiến trình</p>
        <button class="sidebar__login-btn" (click)="login()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Đăng nhập với Google
        </button>
      </ng-template>
    </div>

  </aside>

  <!-- ===== PAGE CONTENT ===== -->
  <main class="app-shell__main">
    <router-outlet></router-outlet>
  </main>
</div>
