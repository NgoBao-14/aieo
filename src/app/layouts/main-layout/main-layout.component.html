<div class="app-shell">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <!-- Brand -->
    <div class="sidebar__brand">
      <div class="sidebar__logo">9S</div>
      <div>
        <a class="sidebar__brand-name" routerLink="/">IELTS<span>9S</span></a>
        <p class="sidebar__brand-tagline">Học IELTS miễn phí</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar__nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Trang Chủ
      </a>

      <span class="sidebar__nav-group">Học mỗi ngày</span>
      <a routerLink="/vocabulary" routerLinkActive="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Từ Vựng
      </a>
      <a routerLink="/dictionary" routerLinkActive="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Từ Điển
      </a>

      <span class="sidebar__nav-group">Luyện tập</span>
      <a routerLink="/exercises" routerLinkActive="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Dạng Bài
      </a>
      <a routerLink="/tests" routerLinkActive="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Luyện Đề
      </a>
    </nav>

    <!-- Auth section -->
    <div class="sidebar__auth">
      <ng-container *ngIf="user$ | async as user; else guestBlock">
        <div class="sidebar__profile">
          <img [src]="user.photoURL || 'assets/avatar-default.png'" [alt]="user.displayName || 'User'" />
          <div class="sidebar__profile-info">
            <strong>{{ user.displayName }}</strong>
            <p>{{ user.email }}</p>
          </div>
        </div>
        <div class="sidebar__auth-links">
          <a routerLink="/dashboard" class="sidebar__dashboard-link">📊 Dashboard</a>
          <button class="sidebar__logout-btn" (click)="logout()">Đăng xuất</button>
        </div>
      </ng-container>
      <ng-template #guestBlock>
        <p class="sidebar__guest-hint">Đăng nhập để lưu tiến trình và theo dõi kết quả</p>
        <button class="sidebar__login-btn" (click)="login()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Đăng nhập với Google
        </button>
      </ng-template>
    </div>
  </aside>

  <!-- ===== PAGE CONTENT ===== -->
  <main class="app-shell__main">
    <router-outlet></router-outlet>
  </main>
</div>
