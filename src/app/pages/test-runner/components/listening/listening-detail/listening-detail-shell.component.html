<div class="listeningDetailShell" *ngIf="activePart as part">
  <div class="listeningPage">
    <div class="listeningPartBanner">
      <h3>Part {{ part.number }}</h3>
      <p>{{ getPartPrompt() }}</p>
    </div>

    <section class="listeningMainSurface">
      <div class="listeningPassageBlock" *ngIf="renderedPassageHtml">
        <div class="passageContent listeningPassageContent" [innerHTML]="renderedPassageHtml"></div>
      </div>

      <app-listening-group-renderer [groups]="activeGroups" [answers]="answers" [currentQId]="currentQId"
        (answerChange)="answerChange.emit($event)"></app-listening-group-renderer>
    </section>
  </div>

  <div class="listeningAudioDock">
    <div class="listeningAudioMeta">
      <span class="audioBadge">Listening Audio</span>
      <span class="listeningAudioLabel">Section {{ part.number }} audio</span>
    </div>
    <audio class="audioPlayer listeningDockPlayer" [src]="part.audioUrl" controls controlsList="nodownload"></audio>

    <div class="audioPagerWrap" *ngIf="allQuestionIds.length">
      <button type="button" class="footerPagerBtn footerPagerBtnListening" [disabled]="!canGoPrevious"
        (click)="previousQuestion.emit()" aria-label="Previous question">
        &lt;
      </button>
      <button type="button" class="footerPagerBtn footerPagerBtnListening" [disabled]="!canGoNext"
        (click)="nextQuestion.emit()" aria-label="Next question">
        &gt;
      </button>
    </div>
  </div>

  <footer class="bottomBar bottomBarListening">
    <div class="footerSegments">
      <div *ngFor="let item of test?.parts; let idx = index; trackBy: trackByPart"
        class="partSegment partSegmentListening" [class.activePartSegment]="idx === activePartIndex"
        (click)="partChange.emit(idx)">
        <div *ngIf="idx !== activePartIndex; else activeListeningNav" class="segmentMeta">
          <span class="partLabel">Part {{ idx + 1 }}</span>
          <span class="partProgressLabel">{{ getFilledCount(item) }} of {{ getPartQuestionCount(item) }}</span>
        </div>

        <ng-template #activeListeningNav>
          <div class="qNavContainer">
            <span class="partLabel">Part {{ idx + 1 }}</span>
            <div class="qNavItemWrap">
              <button *ngFor="let id of getQuestionIdsForPart(idx); trackBy: trackById" type="button" class="qNavItem"
                [class.qNavItemActive]="currentQId === id" [class.qNavItemAnswered]="!!getAnswer(id)"
                (click)="questionNavigate.emit(id); $event.stopPropagation()">
                {{ id }}
              </button>
            </div>
          </div>
        </ng-template>
      </div>
    </div>

    <!-- <button class="submitBtn submitBtnListening" type="button" (click)="submitRequested.emit()">✓</button> -->
  </footer>
</div>
